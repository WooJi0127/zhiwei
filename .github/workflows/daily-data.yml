name: 每日更新数据

# 每天北京时间 09:00 自动跑一次（GitHub 用的是 UTC，09:00 北京 = 01:00 UTC）
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:      # 也可以在 GitHub 网页上手动点一次

permissions:
  contents: write         # 允许把更新后的 data.js 提交回仓库

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 把上一次的 kpop.db 取回来。有它就能增量抓取（约 3 分钟），
      # 没有就得全量重抓（约 25 分钟）。缓存不用提交进仓库，避免仓库膨胀。
      - name: 取出上次的数据库
        uses: actions/cache@v4
        with:
          path: kpop.db
          key: kpop-db-${{ github.run_id }}
          restore-keys: |
            kpop-db-

      # 缓存丢失时的兜底：用仓库里的数据库定稿快照（本地整理好再上传的）。
      # 历史数据在本地定稿后基本不变，云端只做每日增量——
      # 这样缓存失效也不用 25 分钟全量重抓，网页数据和本地永远同源。
      # 更新快照的方法（本地做完数据修正后跑一次）：
      #   gzip -9 kpop.db > data/kpop.db.gz  然后提交推送
      - name: 缓存丢失时解压仓库快照
        run: |
          if [ ! -f kpop.db ] && [ -f data/kpop.db.gz ]; then
            echo "缓存里没有数据库 → 解压定稿快照（含十年历史）"
            gunzip -c data/kpop.db.gz > kpop.db
          fi

      # B 站官方 MV：放在这里跑是因为 Actions 在境外，不会触发 B 站风控
      # （本机连续请求会被 412）。
      # 每次最多抓 40 个艺人（约 10 分钟），没抓完的下次接着补，几天就抓全了；
      # 抓过的艺人记在 bili_seen 表里，不会重复重试。
      - name: 抓取 B 站官方 MV
        continue-on-error: true      # B 站挂了或被限流都不能影响主流程
        run: python scripts/bilibili.py --limit 40

      # 有上次的数据库 → 增量抓取（约 3 分钟）
      # 没有（首次运行，或缓存被清理）→ 自动改全量抓取（约 25 分钟），保证历史完整
      - name: 抓取数据入库并导出 data.js
        run: |
          if [ -f kpop.db ]; then
            echo "检测到已有数据库 → 增量抓取"
            python scripts/build.py
          else
            echo "没有数据库（首次或缓存已失效）→ 全量抓取"
            python scripts/build.py --full
          fi

      # 把界面源码与数据复制到 知未.html / desktop/app / site/app
      - name: 分发到各端
        run: python tools/sync.py

      # 提交后 Cloudflare 会检测到 push，自动重新部署网站
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(data): 自动更新数据 $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "数据无变化，跳过提交"
          fi
