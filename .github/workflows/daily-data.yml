name: 每日更新数据
on:
  schedule:
    - cron: '0 1 * * *'  # 北京时间 09:00；排队可能延后
  workflow_dispatch:
    inputs:
      mode:
        description: 更新采集数据，或只验证正式快照
        type: choice
        default: update
        options: [update, verify]
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data.yml'
      - 'scripts/catalog_state.py'
      - 'scripts/test_catalog_state.py'
permissions:
  contents: write
concurrency:
  group: zhiwei-public-catalog
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - name: 检出锁内最新正式版本
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行离线数据回归测试
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: 从正式快照恢复（缺失或损坏即停止）
        run: python scripts/catalog_state.py restore
      - name: 采集最新发行
        if: github.event_name != 'push' && inputs.mode != 'verify'
        run: python scripts/build.py
      - name: 补抓 B 站官方 MV（包含刚发现的发行）
        if: github.event_name != 'push' && inputs.mode != 'verify'
        continue-on-error: true
        run: python scripts/bilibili.py --releases 3 --ahead 7
      - name: 校验覆盖范围并导出、保存正式快照
        run: |
          python scripts/build.py --export-only
          python scripts/catalog_state.py check
      - name: 下载新增封面
        if: github.event_name != 'push' && inputs.mode != 'verify'
        continue-on-error: true
        run: |
          pip install --quiet Pillow
          python tools/fetch_covers.py
          python tools/fetch_covers.py --mv
      - name: 分发到各端
        run: python tools/sync.py
      - name: 提交同一版本的数据与快照
        if: github.event_name != 'push' && inputs.mode != 'verify'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '正式版本已变化，本次停止发布；下次从新版本重跑，不合并过期产物。'
            exit 1
          fi
          git add -A -- scripts/catalog data core/data core/zhiwei.ics site desktop/app '知未.html' covers covers.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 自动更新数据 $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi
      - name: 留存本次正式数据清单
        uses: actions/upload-artifact@v4
        with:
          name: catalog-manifest-${{ github.run_id }}
          path: scripts/catalog/manifest.json
          retention-days: 30
