<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33473A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>知未 · K-POP 回归日历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20x='3'%20y='3'%20width='94'%20height='94'%20rx='20'%20fill='%2333473A'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='34'%20fill='%231C251F'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='26'%20fill='none'%20stroke='%2346604E'%20stroke-width='1.6'%20stroke-opacity='.5'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='19.5'%20fill='none'%20stroke='%2346604E'%20stroke-width='1.6'%20stroke-opacity='.85'/%3E%3Cpath%20d='M89,15%20C74,25%2057,41%2050,57%20L36,44%20C56,30%2072,20%2087,13%20Z'%20fill='%23D89B6A'%20opacity='.75'/%3E%3Ccircle%20cx='63'%20cy='37'%20r='3'%20fill='%23E9B074'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='17'%20fill='none'%20stroke='%23B5764F'%20stroke-width='1.8'%20stroke-opacity='.6'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='13'%20fill='%23C9885A'/%3E%3Ccircle%20cx='46'%20cy='52'%20r='3'%20fill='%23FAF6EE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">

</head>
<body>

<header>
  <div class="hwrap">
    <div class="htop">
      <div class="brand" id="brandHome" title="知未">
        <!-- 图标（融合版）：唱片同心环由外向内收紧 = 时间由远及近；
             唱臂化作彗星，彗核落在中心铜标 = 回归日。
             跟 assets/icon.svg 保持一致，改图标时两边一起改。 -->
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="trailF" gradientUnits="userSpaceOnUse" x1="89" y1="15" x2="46" y2="52">
              <stop offset="0%"   stop-color="#FAF6EE" stop-opacity="0.30"/>
              <stop offset="45%"  stop-color="#B5764F" stop-opacity="0.50"/>
            </linearGradient>
            <radialGradient id="orbF" cx="46" cy="52" r="11" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#F4D2A8"/>
              <stop offset="60%"  stop-color="#C9885A"/>
              <stop offset="100%" stop-color="#9E5F38"/>
            </radialGradient>
          </defs>
          <rect x="3" y="3" width="94" height="94" rx="20" fill="#33473A"/>
          <circle cx="46" cy="52" r="34" fill="#1C251F"/>
          <circle cx="46" cy="52" r="29"   fill="none" stroke="#46604E" stroke-width="1"   stroke-opacity="0.35"/>
          <circle cx="46" cy="52" r="25"   fill="none" stroke="#46604E" stroke-width="0.9" stroke-opacity="0.55"/>
          <circle cx="46" cy="52" r="21.5" fill="none" stroke="#46604E" stroke-width="0.9" stroke-opacity="0.75"/>
          <circle cx="46" cy="52" r="18.5" fill="none" stroke="#46604E" stroke-width="0.9" stroke-opacity="1"/>
          <path d="M89,15 C74,25 57,41 49,55 L38,46 C56,32 72,20 87,13 Z" fill="url(#trailF)"/>
          <circle cx="75.4" cy="25.4" r="1.5" fill="#FAF6EE" opacity="0.5"/>
          <circle cx="62.8" cy="36.8" r="2.1" fill="#D89B6A" opacity="0.85"/>
          <circle cx="52.3" cy="46.3" r="2.7" fill="#E9B074"/>
          <circle cx="46" cy="52" r="15" fill="none" stroke="#B5764F" stroke-width="1.3" stroke-opacity="0.5"/>
          <circle cx="46" cy="52" r="11" fill="url(#orbF)"/>
          <circle cx="46" cy="52" r="2.4" fill="#FAF6EE"/>
          <path d="M31,41 L32.1,43.5 L34.6,44.6 L32.1,45.7 L31,48.2 L29.9,45.7 L27.4,44.6 L29.9,43.5 Z"
                fill="#FAF6EE" opacity="0.85"/>
        </svg>
      </div>
      <nav class="tabs">
        <button class="tab on" data-view="home">首页</button>
        <button class="tab" data-tab="future">未来</button>
        <button class="tab" data-tab="past">过去</button>
        <button class="tab" data-tab="mine">我的</button>
        <button class="tab" data-tab="more">更多</button>
      </nav>
      <button class="btn stoggle" id="searchToggle" title="搜索" aria-label="搜索"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
    </div>
    <div class="searchcover" id="searchCover" style="display:none">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>
      </svg>
      <input id="q" type="text" placeholder="搜索团体 / 歌手 / 专辑 / 公司 / 粉丝名…" autocomplete="off">
      <button class="sclose" id="qclr" title="关闭"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
  </div>
</header>

<main>
  <div class="notice" id="notice">
    <span id="noticeTxt"></span>
    <button id="noticeBtn">如何更新</button>
  </div>

  <!-- 首页：内容型入口（默认页）。日历界面仍是下面那 5 个 tab -->
  <div id="homeView" style="display:none"></div>

  <div id="listView">
    <!-- 打歌节目时间表：硬编码六档节目（播出日/时间固定），首页改版后直接复用 -->
    <div class="showsbar" id="showsBar"></div>

    <div class="biasbox" id="biasBox" style="display:none">
      <div style="font-weight:800;font-size:14px"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2s-7.2-4.6-7.2-9.7A4.2 4.2 0 0 1 12 8.2a4.2 4.2 0 0 1 7.2 2.3c0 5.1-7.2 9.7-7.2 9.7z"/></svg> 本命团体管理</div>
      <div style="font-size:12.5px;color:var(--sub);margin-top:3px">
        加入本命后：卡片上会出现红爱心，自动置顶高亮，并在「本命动态」单独追踪。
      </div>
      <div class="biaslist" id="biasList"></div>
      <div class="addrow">
        <input id="biasInput" type="text" placeholder="输入团体 / 歌手名，回车添加">
        <button class="btn pri" id="biasAdd">添加</button>
      </div>
      <div class="sugg" id="biasSugg"></div>
    </div>

    <!-- 未来：7 天 / 本月 / 下月 三档 -->
    <div class="simplebar" id="upBar">
      <span class="sbl">范围</span>
      <div class="seg">
        <button data-up="f7">即将回归 · 7 天</button>
        <button data-up="month">本月</button>
        <button data-up="nmonth">下月</button>
      </div>
    </div>

    <!-- 我的：收藏 / 本命 切换 -->
    <div class="simplebar" id="mineBar">
      <span class="sbl">查看</span>
      <div class="seg">
        <button data-mine="fav">我的收藏</button>
        <button data-mine="bias">本命动态</button>
      </div>
    </div>

    <!-- 全部发布：完整筛选 -->
    <div class="filters" id="filters">
      <div class="fg">
        <label>类型</label>
        <select id="fType">
          <option value="">全部类型</option>
          <option value="Single">Single</option>
          <option value="Mini">EP</option>
          <option value="Album">Album</option>
        </select>
      </div>
      <div class="fg">
        <label>艺人</label>
        <select id="fKind">
          <option value="">全部艺人</option>
          <option value="group">团体</option>
          <option value="solo">Solo</option>
          <option value="gg">女团</option>
          <option value="bg">男团</option>
          <option value="coed">混声团</option>
          <option value="female">女歌手</option>
          <option value="male">男歌手</option>
        </select>
      </div>
      <div class="fg">
        <label>公司</label>
        <select id="fAgency"><option value="">全部</option></select>
      </div>
      <div class="fg" style="position:relative">
        <label>时间</label>
        <button class="datebtn" id="dateBtn"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.6" y="5.2" width="16.8" height="15.2" rx="3"/><path d="M8.4 3.2v3.6M15.6 3.2v3.6M3.6 10.2h16.8"/></svg> <span id="dateLabel">未来 30 天</span></button>
      </div>
      <div class="fg">
        <label>排序</label>
        <select id="fSort">
          <option value="date_asc">日期 近→远</option>
          <option value="name">艺人名</option>
        </select>
      </div>
      <div class="spacer"></div>
      <div class="chips">
        <button class="chip" id="cFav"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.9l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 17.1l-5.2 2.8 1-5.75L3.6 10.05l5.8-.85z"/></svg> 只看收藏</button>
        <button class="chip" id="cBias"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2s-7.2-4.6-7.2-9.7A4.2 4.2 0 0 1 12 8.2a4.2 4.2 0 0 1 7.2 2.3c0 5.1-7.2 9.7-7.2 9.7z"/></svg> 只看本命</button>
        <button class="chip" id="cReset" style="display:none">重置</button>
      </div>

      <div class="calpop" id="calPop">
        <div class="calh">
          <button id="calPrev" title="上个月">‹</button>
          <button class="mm" id="calMon" data-calview="1" title="点击选择年份 / 月份">—</button>
          <button id="calNext" title="下个月">›</button>
        </div>
        <div class="calpick" id="calPick"></div>
        <div id="calBody">
          <div class="calw" id="calGrid"></div>
          <div class="caltools">
            <button data-calsel="month">整月</button>
            <button data-calsel="year">整年</button>
            <button data-calsel="clear">清空</button>
          </div>
        </div>
        <div class="calrng" id="calRng">点击日期选择范围，可跨月</div>
        <div class="quick" id="calQuick"></div>
        <div class="calfoot">
          <button id="calClear">清除</button>
          <button class="pri" id="calApply">确定</button>
        </div>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <div id="detailView" style="display:none"></div>

</main>

<footer>
  <span id="genAt"></span>数据来源：<a href="https://kpopping.com" target="_blank" rel="noopener">kpopping.com</a>（回归日程）、
  <a href="https://music.apple.com" target="_blank" rel="noopener">Apple Music</a>（发行归档 / 曲目 / 跳转）、
  <a href="https://kpopcal.com" target="_blank" rel="noopener">kpopcal.com</a>（官方确认事件，CC BY 4.0）。
  「知未」仅做信息聚合与外部跳转，不提供播放服务。
</footer>

<button class="spon" id="sponBtn" aria-label="请我喝杯咖啡吧">
  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
       stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 9h12v6.5A4.5 4.5 0 0 1 12 20h-1A4.5 4.5 0 0 1 6.5 15.5V9Z"/>
    <path d="M16.5 10.6h1.1a2.35 2.35 0 0 1 0 4.7h-1.1"/>
    <path d="M9 6.2c-.7-.8-.7-1.9 0-2.7M13 6.2c-.7-.8-.7-1.9 0-2.7"/>
  </svg>
</button>

<div class="sponpop" id="sponPop" role="dialog" aria-label="赞赏支持">
  <div class="sponh">
    <b>请我喝杯咖啡吧</b>
    <button class="sponx" id="sponX" aria-label="关闭"><svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <p class="spondesc">「知未」免费、无广告、不采集任何数据。<br>如果它帮到了你，欢迎随意支持一下。</p>
  <div class="spontabs">
    <button class="spontab on" data-pay="wechat">微信</button>
    <button class="spontab" data-pay="alipay">支付宝</button>
  </div>
  <div class="sponqr"><img id="sponImg" alt="收款二维码"></div>
  <p class="spontip">长按识别或扫码，金额随意</p>
</div>

<div class="toast" id="toast"></div>

<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
