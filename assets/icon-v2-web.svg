<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- 网页风版：浅米白底 + 墨绿描边唱片，呼应站点纸感与书卷气 -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#FAF6EE" stroke="#33473A" stroke-width="1.5"/>
  <!-- 唱片：浅绿填充 + 墨绿描边，取代原黑盘，更通透 -->
  <circle cx="50" cy="50" r="33" fill="#EFF2EC" stroke="#33473A" stroke-width="2.5"/>
  <!-- 12 个时刻点，1 用铜色高亮（倒计时终点） -->
  <g fill="#33473A">
    <circle cx="50"   cy="20"   r="1.4"/>
    <circle cx="65"   cy="24"   r="2"   fill="#B5764F"/>
    <circle cx="76"   cy="25"   r="1.4"/>
    <circle cx="80"   cy="50"   r="1.4"/>
    <circle cx="76"   cy="75"   r="1.4"/>
    <circle cx="65"   cy="76"   r="1.4"/>
    <circle cx="50"   cy="80"   r="1.4"/>
    <circle cx="35"   cy="76"   r="1.4"/>
    <circle cx="24"   cy="75"   r="1.4"/>
    <circle cx="20"   cy="50"   r="1.4"/>
    <circle cx="24"   cy="25"   r="1.4"/>
    <circle cx="35"   cy="24"   r="1.4"/>
  </g>
  <!-- 铜标 + 奶油心 -->
  <circle cx="50" cy="50" r="9" fill="#B5764F"/>
  <circle cx="50" cy="50" r="2.6" fill="#FAF6EE"/>
  <!-- 绿唱臂 + 铜色针头 -->
  <line x1="84" y1="16" x2="70" y2="32" stroke="#33473A" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="84" cy="16" r="4" fill="#33473A"/>
  <circle cx="70" cy="32" r="2.4" fill="#B5764F"/>
</svg>
