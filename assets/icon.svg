<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- 墨绿圆角底 -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="#33473A"/>

  <!-- 唱片：深色盘面 + 两道纹路 -->
  <circle cx="45" cy="50" r="35" fill="#1C251F"/>
  <circle cx="45" cy="50" r="31" fill="none" stroke="#3E5446" stroke-width="1"/>
  <circle cx="45" cy="50" r="25" fill="none" stroke="#3E5446" stroke-width="0.7"/>

  <!-- 倒着数的钟面：12 在顶，顺读向左，取其「回归倒计时」的意思。
       注意这里的数字顺序和站内 header 完全一致，不要两边各改各的。 -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
     font-weight="600" font-size="9.5" fill="#FAF6EE" text-anchor="middle">
    <text x="45" y="30.5">12</text>
    <text x="58.5" y="34.5">11</text>
    <text x="68.5" y="41.5">10</text>
    <text x="72.5" y="53">9</text>
    <text x="68.5" y="64.5">8</text>
    <text x="58.5" y="71.5">7</text>
    <text x="45" y="75.5">6</text>
    <text x="31.5" y="71.5">5</text>
    <text x="21.5" y="64.5">4</text>
    <text x="17.5" y="53">3</text>
    <text x="21.5" y="41.5">2</text>
    <text x="31.5" y="34.5">1</text>
  </g>

  <!-- 铜色标签 + 中轴 -->
  <circle cx="45" cy="50" r="8.5" fill="#B5764F"/>
  <circle cx="45" cy="50" r="2.2" fill="#FAF6EE"/>

  <!-- 唱臂：从右上角伸向盘面 -->
  <g>
    <line x1="84" y1="16" x2="66" y2="38" stroke="#FAF6EE" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="84" cy="16" r="4.5" fill="#B5764F"/>
    <circle cx="66" cy="38" r="2.6" fill="#FAF6EE"/>
  </g>
</svg>
