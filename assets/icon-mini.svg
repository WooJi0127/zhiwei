<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!--
    小尺寸专用（≤64px）。完整版那几道细环和细刻度缩到 16px 会糊成一团灰，
    这里只保留认得出的：墨绿方块、唱片深色盘、铜色彗核、彗星尾巴。
    线条整体加粗，并给盘面加一圈淡描边，免得深色盘和深色底压在一起分不开。
  -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="#33473A"/>

  <circle cx="46" cy="52" r="34" fill="#1C251F"/>
  <circle cx="46" cy="52" r="34" fill="none" stroke="#FAF6EE"
          stroke-opacity="0.22" stroke-width="2.4"/>

  <circle cx="46" cy="52" r="26"   fill="none" stroke="#46604E" stroke-width="1.6" stroke-opacity="0.5"/>
  <circle cx="46" cy="52" r="19.5" fill="none" stroke="#46604E" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- 彗星唱臂（加粗版） -->
  <path d="M89,15 C74,25 57,41 50,57 L36,44 C56,30 72,20 87,13 Z" fill="#D89B6A" opacity="0.7"/>
  <circle cx="63" cy="37" r="3" fill="#E9B074"/>

  <!-- 彗核 = 中心铜标 = 回归日 -->
  <circle cx="46" cy="52" r="19" fill="#B5764F" opacity="0.30"/>
  <circle cx="46" cy="52" r="17" fill="none" stroke="#B5764F" stroke-width="1.8" stroke-opacity="0.6"/>
  <circle cx="46" cy="52" r="13" fill="#C9885A"/>
  <circle cx="46" cy="52" r="3" fill="#FAF6EE"/>
</svg>
